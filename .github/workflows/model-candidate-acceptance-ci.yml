name: model-candidate-acceptance-ci

on:
  pull_request:
    paths:
      - 'scripts/accept_hf_model_candidate.py'
      - 'tests/test_model_candidate_acceptance.py'
      - 'src/three_agent/local_embedding.py'
      - 'src/three_agent/model_artifacts.py'
      - 'src/three_agent/model_residency.py'
      - '.github/workflows/model-candidate-acceptance-ci.yml'
  push:
    paths:
      - 'scripts/accept_hf_model_candidate.py'
      - 'tests/test_model_candidate_acceptance.py'
      - 'src/three_agent/local_embedding.py'
      - 'src/three_agent/model_artifacts.py'
      - 'src/three_agent/model_residency.py'
      - '.github/workflows/model-candidate-acceptance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-candidate-acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-acceptance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install WorkSpace core
        run: python -m pip install -e .

      - name: Run candidate acceptance regression suite
        run: python -m unittest discover -s tests -p 'test_model_candidate_acceptance.py' -v

      - name: Compile acceptance boundary
        run: python -m py_compile scripts/accept_hf_model_candidate.py tests/test_model_candidate_acceptance.py

name: computer-use-linux-adapter-ci

on:
  pull_request:
    paths:
      - 'src/three_agent/computer_use.py'
      - 'src/three_agent/task_contract.py'
      - 'src/three_agent/capability_authority.py'
      - 'src/three_agent/computer_use_replay.py'
      - 'src/three_agent/computer_use_linux_observation.py'
      - 'src/three_agent/computer_use_linux_interaction.py'
      - 'tests/test_computer_use.py'
      - 'tests/test_computer_use_governance.py'
      - 'tests/test_computer_use_linux_observation.py'
      - 'tests/test_computer_use_linux_interaction.py'
      - 'tests/test_computer_use_linux_atspi_live.py'
      - '.github/workflows/computer-use-linux-adapter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cu180-linux-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install exact candidate
        run: python -m pip install -e .
      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Run canonical governance tests
        run: |
          python -m unittest discover -s tests -p 'test_computer_use.py' -v
          python -m unittest discover -s tests -p 'test_computer_use_governance.py' -v
      - name: Run Linux observation boundary tests
        run: python -m unittest discover -s tests -p 'test_computer_use_linux_observation.py' -v
      - name: Run Linux interaction boundary tests
        run: python -m unittest discover -s tests -p 'test_computer_use_linux_interaction.py' -v
      - name: Record contract acceptance
        if: always()
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo 'CU-180 Linux adapter contract acceptance'
            echo "head=$EXPECTED_HEAD"
            echo 'python=${{ matrix.python }}'
            echo 'runner=ubuntu-24.04'
            echo 'semantic_backend=AT-SPI2 direct GI'
            echo 'screenshot_fallback=explicit_on_demand_observation_only'
            echo 'input_fallback=fail_closed_not_implemented'
            echo 'shell_generation=none'
            echo 'privileged_broker=not_used'
          } >> "$GITHUB_STEP_SUMMARY"

  atspi-live:
    name: live AT-SPI2 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Linux accessibility runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core \
            dbus-x11 \
            gir1.2-atspi-2.0 \
            gir1.2-gtk-3.0 \
            openbox \
            python3-gi \
            python3-venv \
            xvfb
      - name: Create system-Python environment with GI access
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv-cu180
          .venv-cu180/bin/python -m pip install --upgrade pip
          .venv-cu180/bin/python -m pip install -e .
      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify AT-SPI2 runtime import
        run: |
          .venv-cu180/bin/python - <<'PY'
          import gi
          gi.require_version('Atspi', '2.0')
          from gi.repository import Atspi
          Atspi.init()
          assert Atspi.get_desktop(0) is not None
          print('AT-SPI2 runtime import: PASS')
          PY
      - name: Run live GTK + AT-SPI2 semantic acceptance
        env:
          NO_AT_BRIDGE: '0'
        run: |
          xvfb-run --auto-servernum dbus-run-session -- bash -lc '
            set -euo pipefail
            export NO_AT_BRIDGE=0
            gsettings set org.gnome.desktop.interface toolkit-accessibility true
            openbox >/tmp/cu180-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid >/dev/null 2>&1 || true" EXIT
            sleep 1
            .venv-cu180/bin/python -m unittest discover -s tests -p "test_computer_use_linux_atspi_live.py" -v
          '
      - name: Record live acceptance
        if: always()
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo 'CU-180 Linux live AT-SPI2 acceptance'
            echo "head=$EXPECTED_HEAD"
            echo 'runner=ubuntu-24.04 + Xvfb + D-Bus session + Openbox'
            echo 'fixture=real GTK3 accessibility tree'
            echo 'observation=direct Atspi.get_desktop semantic traversal'
            echo 'interaction=EditableText.set_text_contents + Action.do_action'
            echo 'arbitrary_shell_from_model=none'
            echo 'privileged_broker=not_used'
          } >> "$GITHUB_STEP_SUMMARY"

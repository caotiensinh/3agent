name: canonical-autoheal-safe

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

concurrency:
  group: canonical-autoheal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autoheal-safe-reexports:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard regression tests
        run: python -m unittest tests.test_canonical_module_guard -v
      - name: Apply mechanically provable canonical repairs
        run: |
          python scripts/canonical_module_guard.py \
            --fix-safe \
            --report-only \
            --json-output "$RUNNER_TEMP/canonical-after-safe-fix.json" \
            --markdown-output "$RUNNER_TEMP/canonical-after-safe-fix.md"
      - name: Validate repaired source
        if: ${{ hashFiles('src/**/*.py') != '' }}
        run: python -m compileall -q src
      - name: Commit safe repairs when present
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            echo "No mechanically provable safe canonical repair found."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(governance): auto-heal safe canonical reexports"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Publish auto-heal summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/canonical-after-safe-fix.md" ]; then
            cat "$RUNNER_TEMP/canonical-after-safe-fix.md" >> "$GITHUB_STEP_SUMMARY"
          fi

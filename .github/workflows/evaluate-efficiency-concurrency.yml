name: evaluate-efficiency-concurrency

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type EVALUATE to authorize local D7-06 observation execution'
        required: true
        default: ''
      source_ref:
        description: 'Exact 40-hex WorkSpace commit SHA to observe'
        required: true
        default: ''
      model:
        description: 'Preinstalled local Ollama model used for structured concurrency'
        required: true
        default: 'qwen3:30b'
      concurrency:
        description: 'Concurrent structured requests (2..32)'
        required: true
        default: '4'
      samples:
        description: 'Total structured requests (2..128, >= concurrency)'
        required: true
        default: '8'

permissions:
  contents: read

concurrency:
  group: workspace-d7-efficiency-concurrency-observation
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ inputs.confirm == 'EVALUATE' }}
    runs-on: [self-hosted, Linux, X64, rtx5090]
    timeout-minutes: 120
    env:
      OBS_ROOT: ${{ runner.temp }}/workspace-d7-efficiency-${{ github.run_id }}
    steps:
      - name: Checkout exact observation source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source lineage
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_ref }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install exact WorkSpace source without network dependency resolution
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --no-deps -e .
          workspace-benchmark-readiness --help >/dev/null
          workspace-eval-efficiency-observe --help >/dev/null

      - name: Capture metadata-only hardware readiness receipt
        id: readiness
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_ref }}
          MODEL: ${{ inputs.model }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$OBS_ROOT"
          workspace-benchmark-readiness \
            --source-ref "$EXPECTED_SHA" \
            --repo-root "$GITHUB_WORKSPACE" \
            --model "$MODEL" \
            --output "$OBS_ROOT/environment.json" \
            >/dev/null
          test -s "$OBS_ROOT/environment.json"

      - name: Collect D7-06 precursor observations
        id: observation
        if: ${{ steps.readiness.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_ref }}
          MODEL: ${{ inputs.model }}
          CONCURRENCY: ${{ inputs.concurrency }}
          SAMPLES: ${{ inputs.samples }}
        run: |
          set -Eeuo pipefail
          workspace-eval-efficiency-observe \
            --source-ref "$EXPECTED_SHA" \
            --repo-root "$GITHUB_WORKSPACE" \
            --environment "$OBS_ROOT/environment.json" \
            --model "$MODEL" \
            --concurrency "$CONCURRENCY" \
            --samples "$SAMPLES" \
            --output "$OBS_ROOT/observation.json" \
            >/dev/null
          test -s "$OBS_ROOT/observation.json"

      - name: Publish metadata-only observation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: d7-efficiency-concurrency-observation-${{ inputs.source_ref }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/workspace-d7-efficiency-${{ github.run_id }}/environment.json
            ${{ runner.temp }}/workspace-d7-efficiency-${{ github.run_id }}/observation.json

      - name: Require complete observation
        if: ${{ always() }}
        shell: bash
        env:
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
          OBSERVATION_OUTCOME: ${{ steps.observation.outcome }}
        run: |
          set -Eeuo pipefail
          test "$READINESS_OUTCOME" = "success"
          test "$OBSERVATION_OUTCOME" = "success"

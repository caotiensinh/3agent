name: security-real-lan-readonly-acceptance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_BOUNDED_REAL_LAN_READONLY to run the approved two-target check'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: security-real-lan-readonly-acceptance
  cancel-in-progress: false

jobs:
  bounded-real-lan-readonly:
    name: bounded-real-lan-readonly
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Require explicit production-LAN confirmation
        shell: bash
        if: runner.os != 'Windows'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -eu
          test "$CONFIRMATION" = 'RUN_BOUNDED_REAL_LAN_READONLY' || {
            echo '::error::Explicit bounded real-LAN confirmation did not match.'
            exit 1
          }

      - name: Boundary declaration
        shell: bash
        if: runner.os != 'Windows'
        run: |
          set -eu
          echo 'MODE=READ_ONLY_NON_DISRUPTIVE'
          echo 'AUTHORIZED_TARGETS=192.168.11.1,192.168.11.116'
          echo 'NO_PCAP=true'
          echo 'NO_CREDENTIALS=true'
          echo 'NO_NETWORK_MUTATION=true'
          echo 'NO_ARBITRARY_SCAN=true'

      - name: Bounded reachability check (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          out="$RUNNER_TEMP/security-real-lan-readonly.txt"
          : > "$out"
          check_target() {
            name="$1"
            ip="$2"
            shift 2
            reachable=0
            echo "target=$name ip=$ip" | tee -a "$out"
            if ping -c 2 -W 1 "$ip" >/dev/null 2>&1; then
              echo "ping=reachable" | tee -a "$out"
              reachable=1
            else
              echo "ping=not_confirmed" | tee -a "$out"
            fi
            for port in "$@"; do
              if (echo >/dev/tcp/"$ip"/"$port") >/dev/null 2>&1; then
                echo "tcp_port_${port}=open" | tee -a "$out"
                reachable=1
              else
                echo "tcp_port_${port}=closed_or_filtered" | tee -a "$out"
              fi
            done
            echo '---' | tee -a "$out"
            if [ "$reachable" -ne 1 ]; then
              echo "::error::No bounded read-only reachability evidence for $name ($ip)"
              return 1
            fi
          }
          failed=0
          check_target router 192.168.11.1 80 443 || failed=1
          check_target cisco_switch 192.168.11.116 22 80 443 || failed=1
          cat "$out"
          exit "$failed"

      - name: Require explicit production-LAN confirmation (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:CONFIRMATION -ne 'RUN_BOUNDED_REAL_LAN_READONLY') {
            Write-Error 'Explicit bounded real-LAN confirmation did not match.'
            exit 1
          }

      - name: Boundary declaration (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host 'MODE=READ_ONLY_NON_DISRUPTIVE'
          Write-Host 'AUTHORIZED_TARGETS=192.168.11.1,192.168.11.116'
          Write-Host 'NO_PCAP=true'
          Write-Host 'NO_CREDENTIALS=true'
          Write-Host 'NO_NETWORK_MUTATION=true'
          Write-Host 'NO_ARBITRARY_SCAN=true'

      - name: Bounded reachability check (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'security-real-lan-readonly.txt'
          $targets = @(
            @{ Name = 'router'; Ip = '192.168.11.1'; Ports = @(80, 443) },
            @{ Name = 'cisco_switch'; Ip = '192.168.11.116'; Ports = @(22, 80, 443) }
          )
          $failed = $false
          $lines = New-Object System.Collections.Generic.List[string]
          foreach ($target in $targets) {
            $reachable = $false
            $lines.Add("target=$($target.Name) ip=$($target.Ip)")
            $ping = Test-Connection -ComputerName $target.Ip -Count 2 -Quiet -ErrorAction SilentlyContinue
            if ($ping) {
              $lines.Add('ping=reachable')
              $reachable = $true
            } else {
              $lines.Add('ping=not_confirmed')
            }
            foreach ($port in $target.Ports) {
              $tcp = Test-NetConnection -ComputerName $target.Ip -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue
              if ($tcp) {
                $lines.Add("tcp_port_${port}=open")
                $reachable = $true
              } else {
                $lines.Add("tcp_port_${port}=closed_or_filtered")
              }
            }
            $lines.Add('---')
            if (-not $reachable) {
              Write-Error "No bounded read-only reachability evidence for $($target.Name) ($($target.Ip))"
              $failed = $true
            }
          }
          $lines | Set-Content -Path $out -Encoding UTF8
          Get-Content $out
          if ($failed) { exit 1 }

      - name: Upload metadata-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-real-lan-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/security-real-lan-readonly.txt
          if-no-files-found: warn
          retention-days: 7

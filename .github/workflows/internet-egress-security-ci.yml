name: internet-egress-security-ci

on:
  push:
    paths:
      - "src/three_agent/**"
      - "tests/test_internet_gateway_no_bypass.py"
      - "tests/test_internet_gateway_ssrf.py"
      - ".github/workflows/internet-egress-security-ci.yml"
  pull_request:
    paths:
      - "src/three_agent/**"
      - "tests/test_internet_gateway_no_bypass.py"
      - "tests/test_internet_gateway_ssrf.py"
      - ".github/workflows/internet-egress-security-ci.yml"

permissions:
  contents: read

jobs:
  no-bypass:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile no-bypass regression gate
        run: python -m py_compile tests/test_internet_gateway_no_bypass.py
      - name: Run no-bypass regression gate
        run: python -m unittest tests.test_internet_gateway_no_bypass -v

  ssrf-boundary:
    if: ${{ hashFiles('tests/test_internet_gateway_ssrf.py') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Compile SSRF regression gate
        run: python -m py_compile tests/test_internet_gateway_ssrf.py
      - name: Run SSRF regression gate
        run: python -m unittest tests.test_internet_gateway_ssrf -v

name: validate-icmp-fix-full-harness

on:
  push:
    branches:
      - test/read-only-lan-probe-20260901
    paths:
      - '.github/workflows/validate-icmp-fix-full-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-harness-exact-head:
    name: Full harness mirror Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact fix head
        uses: actions/checkout@v4
        with:
          ref: bada09f8a6a4577410e889a96ba06a153a9981e3
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies including monitoring SNMP extra
        run: python -m pip install -e ".[monitoring-snmp]"

      - name: Verify exact head
        run: |
          test "$(git rev-parse HEAD)" = "bada09f8a6a4577410e889a96ba06a153a9981e3"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Skill security admission
        run: python scripts/scan_skills.py

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Enterprise verification EV-01 through EV-10
        env:
          EXACT_SOURCE_SHA: bada09f8a6a4577410e889a96ba06a153a9981e3
        run: |
          python scripts/security_enterprise_verify.py \
            --source-sha "$EXACT_SOURCE_SHA" \
            --output "$RUNNER_TEMP/security-enterprise-verification.json"

      - name: Upload enterprise verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: icmp-fix-enterprise-verification-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/security-enterprise-verification.json
          if-no-files-found: error
          retention-days: 7

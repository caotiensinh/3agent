name: security-pcap-cross-platform

on:
  push:
    branches: [main]
    paths:
      - 'src/three_agent/security_monitoring/pcap_evidence.py'
      - 'src/three_agent/security_monitoring/pcap_task_invocation.py'
      - 'tests/test_security_pcap*.py'
      - '.github/workflows/security-pcap-cross-platform.yml'
  pull_request:
    paths:
      - 'src/three_agent/security_monitoring/pcap_evidence.py'
      - 'src/three_agent/security_monitoring/pcap_task_invocation.py'
      - 'tests/test_security_pcap*.py'
      - '.github/workflows/security-pcap-cross-platform.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pcap-readonly:
    name: pcap-readonly (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project dependencies
        run: python -m pip install -e ".[monitoring-snmp]"
      - name: Compile PCAP security modules and tests
        run: python -m compileall -q src/three_agent/security_monitoring/pcap_evidence.py src/three_agent/security_monitoring/pcap_task_invocation.py tests/test_security_pcap_task_read.py tests/test_security_pcap_hardening.py
      - name: Run bounded PCAP security tests
        run: python -m unittest discover -s tests -p "test_security_pcap*.py" -v

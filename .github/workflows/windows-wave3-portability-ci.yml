name: windows-wave3-portability-ci

on:
  pull_request:
    paths:
      - 'tests/test_dock_display_driver_wave3.py'
      - '.github/workflows/windows-wave3-portability-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tests/test_dock_display_driver_wave3.py'
      - '.github/workflows/windows-wave3-portability-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-wave3-portability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wave3-portability:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install exact candidate
        shell: pwsh
        run: python -m pip install -e .
      - name: Run Wave-3 cross-platform diagnostics tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_dock_display_driver_wave3.py" -v

name: portable-deploy-ci

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap.sh'
      - 'scripts/deploy_ubuntu_pc.sh'
      - 'scripts/ci_diagnostics.sh'
      - 'scripts/test_deploy_ubuntu_pc_contract.sh'
      - 'scripts/update_code_safe.sh'
      - 'scripts/test_update_code_safe_contract.sh'
      - 'scripts/update_workspace_ubuntu.sh'
      - 'scripts/test_update_workspace_ubuntu_contract.sh'
      - '.github/workflows/portable-deploy-ci.yml'
      - '.github/workflows/live-chat-multiturn-acceptance.yml'
      - 'src/three_agent/adaptive_learning*.py'
      - 'tests/test_adaptive_learning*.py'
      - 'docs/knowledge/ADAPTIVE_LEARNING*.md'
      - 'src/three_agent/network_*.py'
      - 'tests/test_network_*.py'
      - 'evaluation/network_*.json'
      - 'docs/WORKSPACE_NETWORK_*.md'
      - 'src/three_agent/security_monitoring/**'
      - 'src/three_agent/security_*.py'
      - 'tests/test_security_monitoring*.py'
      - 'docs/knowledge/NETWORK_SECURITY_INTELLIGENCE*.md'
      - 'config/security*.json'
      - 'src/three_agent/vulnerability_intelligence/**'
      - 'tests/test_vulnerability_intelligence*.py'
      - 'docs/knowledge/VULNERABILITY_INTELLIGENCE*.md'
      - 'src/three_agent/chat_context.py'
      - 'src/three_agent/chat_gateway.py'
      - 'src/three_agent/chat_output_contract.py'
      - 'src/three_agent/chat_service_fidelity.py'
      - 'src/three_agent/chat_multiturn_acceptance.py'
      - 'tests/test_chat_output_contract.py'
      - 'tests/test_live_multiturn_workflow_contract.py'
      - 'pyproject.toml'
      - 'config/test.example.json'
      - 'README.md'
      - 'docs/PORTABLE_DEPLOY.md'
  pull_request:
    paths:
      - 'scripts/bootstrap.sh'
      - 'scripts/deploy_ubuntu_pc.sh'
      - 'scripts/ci_diagnostics.sh'
      - 'scripts/test_deploy_ubuntu_pc_contract.sh'
      - 'scripts/update_code_safe.sh'
      - 'scripts/test_update_code_safe_contract.sh'
      - 'scripts/update_workspace_ubuntu.sh'
      - 'scripts/test_update_workspace_ubuntu_contract.sh'
      - '.github/workflows/portable-deploy-ci.yml'
      - '.github/workflows/live-chat-multiturn-acceptance.yml'
      - 'src/three_agent/adaptive_learning*.py'
      - 'tests/test_adaptive_learning*.py'
      - 'docs/knowledge/ADAPTIVE_LEARNING*.md'
      - 'src/three_agent/network_*.py'
      - 'tests/test_network_*.py'
      - 'evaluation/network_*.json'
      - 'docs/WORKSPACE_NETWORK_*.md'
      - 'src/three_agent/security_monitoring/**'
      - 'src/three_agent/security_*.py'
      - 'tests/test_security_monitoring*.py'
      - 'docs/knowledge/NETWORK_SECURITY_INTELLIGENCE*.md'
      - 'config/security*.json'
      - 'src/three_agent/vulnerability_intelligence/**'
      - 'tests/test_vulnerability_intelligence*.py'
      - 'docs/knowledge/VULNERABILITY_INTELLIGENCE*.md'
      - 'src/three_agent/chat_context.py'
      - 'src/three_agent/chat_gateway.py'
      - 'src/three_agent/chat_output_contract.py'
      - 'src/three_agent/chat_service_fidelity.py'
      - 'src/three_agent/chat_multiturn_acceptance.py'
      - 'tests/test_chat_output_contract.py'
      - 'tests/test_live_multiturn_workflow_contract.py'
      - 'pyproject.toml'
      - 'config/test.example.json'
      - 'README.md'
      - 'docs/PORTABLE_DEPLOY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
      - name: Portable contract diagnostic snapshot
        shell: bash
        run: |
          source scripts/ci_diagnostics.sh
          ci_diag_snapshot "portable-contract"
      - name: Deployment entrypoint contracts
        shell: bash
        run: |
          source scripts/ci_diagnostics.sh
          failures=0
          for script in \
            scripts/test_deploy_ubuntu_pc_contract.sh \
            scripts/test_update_code_safe_contract.sh \
            scripts/test_update_workspace_ubuntu_contract.sh
          do
            if ! ci_run_logged "portable-$(basename "$script" .sh)" bash "$script"; then
              failures=$((failures + 1))
            fi
          done
          if [[ "$failures" -ne 0 ]]; then
            ci_failure_snapshot "portable-contract-${failures}-failed"
            exit 1
          fi
      - name: ShellCheck
        shell: bash
        run: |
          source scripts/ci_diagnostics.sh
          ci_run_logged "portable-shellcheck" shellcheck \
            scripts/bootstrap.sh \
            scripts/deploy_ubuntu_pc.sh \
            scripts/ci_diagnostics.sh \
            scripts/test_deploy_ubuntu_pc_contract.sh \
            scripts/update_code_safe.sh \
            scripts/test_update_code_safe_contract.sh \
            scripts/update_workspace_ubuntu.sh \
            scripts/test_update_workspace_ubuntu_contract.sh
      - name: Upload portable contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-contract-diagnostics
          path: ${{ runner.temp }}/three-agent-ci-diagnostics
          if-no-files-found: warn
          retention-days: 14

  clean-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Resolve deployment ref
        id: deploy_ref
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "${GITHUB_HEAD_REF:-}" ]]; then
            printf 'ref=%s\n' "$GITHUB_HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi
          printf 'expected_head=%s\n' "$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
      - name: Portable clean-install diagnostic snapshot
        shell: bash
        run: |
          source scripts/ci_diagnostics.sh
          ci_diag_snapshot "portable-clean-install-${{ matrix.os }}-py${{ matrix.python }}"
      - name: One-command Ubuntu PC deployment from GitHub
        shell: bash
        env:
          DEPLOY_ENTRYPOINT_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.deploy_ref.outputs.expected_head }}/scripts/deploy_ubuntu_pc.sh
          THREE_AGENT_BOOTSTRAP_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.deploy_ref.outputs.expected_head }}/scripts/bootstrap.sh
          THREE_AGENT_REPO_URL: https://github.com/${{ github.repository }}.git
          THREE_AGENT_REPO_REF: ${{ steps.deploy_ref.outputs.ref }}
          THREE_AGENT_INSTALL_DIR: ${{ runner.temp }}/three-agent-install
          THREE_AGENT_BIN_DIR: ${{ runner.temp }}/three-agent-bin
          THREE_AGENT_RELEASES_DIR: ${{ runner.temp }}/three-agent-releases
          THREE_AGENT_STATE_DIR: ${{ runner.temp }}/three-agent-state
          THREE_AGENT_SKIP_SYSTEM_PACKAGES: '1'
        run: |
          source scripts/ci_diagnostics.sh
          deploy_script="$RUNNER_TEMP/deploy_ubuntu_pc.sh"
          curl -fsSL --retry 3 --connect-timeout 15 "$DEPLOY_ENTRYPOINT_URL" -o "$deploy_script"
          printf 'deploy_script_sha256=%s\n' "$(sha256sum "$deploy_script" | awk '{print $1}')"
          bash -n "$deploy_script"
          if ! ci_run_logged "portable-first-deploy" bash "$deploy_script"; then
            ci_failure_snapshot "portable-first-deploy"
            exit 1
          fi
      - name: Verify installed command and source lineage
        shell: bash
        run: |
          source scripts/ci_diagnostics.sh
          ci_run_logged "portable-installed-smoke" "${{ runner.temp }}/three-agent-bin/3agent" smoke
          test -x "${{ runner.temp }}/three-agent-bin/3agent-update"
          test -f "${{ runner.temp }}/three-agent-install/config/local.json"
          test "$(git -C "${{ runner.temp }}/three-agent-install" rev-parse HEAD)" = "${{ steps.deploy_ref.outputs.expected_head }}" || {
            echo "Installed commit does not match expected source head" >&2
            ci_failure_snapshot "portable-source-lineage"
            exit 1
          }
          grep -Fq "https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.deploy_ref.outputs.ref }}/scripts/update_code_safe.sh" "${{ runner.temp }}/three-agent-bin/3agent-update" || {
            echo "Generated updater is not bound to the non-destructive updater on the configured repository ref" >&2
            ci_failure_snapshot "portable-updater-binding"
            exit 1
          }
          if grep -Fq '/scripts/bootstrap.sh' "${{ runner.temp }}/three-agent-bin/3agent-update"; then
            echo "Generated updater must not re-run bootstrap.sh" >&2
            ci_failure_snapshot "portable-updater-bootstrap-regression"
            exit 1
          fi
      - name: One-command real Ubuntu updater from exact GitHub source
        shell: bash
        env:
          UPDATE_ENTRYPOINT_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.deploy_ref.outputs.expected_head }}/scripts/update_workspace_ubuntu.sh
          THREE_AGENT_REPO_URL: https://github.com/${{ github.repository }}.git
          THREE_AGENT_REPO_REF: ${{ steps.deploy_ref.outputs.expected_head }}
          THREE_AGENT_INSTALL_DIR: ${{ runner.temp }}/three-agent-install
          THREE_AGENT_BIN_DIR: ${{ runner.temp }}/three-agent-bin
          THREE_AGENT_RELEASES_DIR: ${{ runner.temp }}/three-agent-releases
          THREE_AGENT_STATE_DIR: ${{ runner.temp }}/three-agent-state
        run: |
          source scripts/ci_diagnostics.sh
          before="$(sha256sum "${{ runner.temp }}/three-agent-install/config/local.json" | awk '{print $1}')"
          update_script="$RUNNER_TEMP/update_workspace_ubuntu.sh"
          curl -fsSL --retry 3 --connect-timeout 15 "$UPDATE_ENTRYPOINT_URL" -o "$update_script"
          printf 'update_script_sha256=%s\n' "$(sha256sum "$update_script" | awk '{print $1}')"
          bash -n "$update_script"
          if ! ci_run_logged "portable-real-updater" bash "$update_script"; then
            ci_failure_snapshot "portable-real-updater"
            exit 1
          fi
          after="$(sha256sum "${{ runner.temp }}/three-agent-install/config/local.json" | awk '{print $1}')"
          test "$before" = "$after"
          test "$(tail -n 1 "${{ runner.temp }}/three-agent-state/active-releases.log" | awk -F '\t' '{print $2}')" = "${{ steps.deploy_ref.outputs.expected_head }}"
          ci_run_logged "portable-post-update-smoke" "${{ runner.temp }}/three-agent-bin/3agent" smoke
      - name: Re-run bootstrap idempotently and preserve config
        shell: bash
        env:
          DEPLOY_ENTRYPOINT_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.deploy_ref.outputs.expected_head }}/scripts/deploy_ubuntu_pc.sh
          THREE_AGENT_BOOTSTRAP_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.deploy_ref.outputs.expected_head }}/scripts/bootstrap.sh
          THREE_AGENT_REPO_URL: https://github.com/${{ github.repository }}.git
          THREE_AGENT_REPO_REF: ${{ steps.deploy_ref.outputs.ref }}
          THREE_AGENT_INSTALL_DIR: ${{ runner.temp }}/three-agent-install
          THREE_AGENT_BIN_DIR: ${{ runner.temp }}/three-agent-bin
          THREE_AGENT_RELEASES_DIR: ${{ runner.temp }}/three-agent-releases
          THREE_AGENT_STATE_DIR: ${{ runner.temp }}/three-agent-state
          THREE_AGENT_SKIP_SYSTEM_PACKAGES: '1'
        run: |
          source scripts/ci_diagnostics.sh
          install_dir="${{ runner.temp }}/three-agent-install"
          config_path="$install_dir/config/local.json"
          runner_state="$install_dir/actions-runner/.credentials"
          backup_path="$install_dir/config/local.json.backup-ci"
          before_path="$install_dir/config/local.json.before-ci"
          operator_state="$install_dir/operator-local-state.keep"

          mkdir -p "$install_dir/actions-runner"
          printf '\n' >> "$config_path"
          printf 'runner-sentinel\n' > "$runner_state"
          printf 'backup-sentinel\n' > "$backup_path"
          printf 'before-sentinel\n' > "$before_path"
          printf 'operator-sentinel\n' > "$operator_state"

          before="$(sha256sum "$config_path" | awk '{print $1}')"
          runner_before="$(sha256sum "$runner_state" | awk '{print $1}')"
          backup_before="$(sha256sum "$backup_path" | awk '{print $1}')"
          before_before="$(sha256sum "$before_path" | awk '{print $1}')"
          operator_before="$(sha256sum "$operator_state" | awk '{print $1}')"

          deploy_script="$RUNNER_TEMP/deploy_ubuntu_pc-rerun.sh"
          curl -fsSL --retry 3 --connect-timeout 15 "$DEPLOY_ENTRYPOINT_URL" -o "$deploy_script"
          bash -n "$deploy_script"
          if ! ci_run_logged "portable-idempotent-redeploy" bash "$deploy_script"; then
            ci_failure_snapshot "portable-idempotent-redeploy"
            exit 1
          fi

          after="$(sha256sum "$config_path" | awk '{print $1}')"
          test "$before" = "$after"
          test "$runner_before" = "$(sha256sum "$runner_state" | awk '{print $1}')"
          test "$backup_before" = "$(sha256sum "$backup_path" | awk '{print $1}')"
          test "$before_before" = "$(sha256sum "$before_path" | awk '{print $1}')"
          test "$operator_before" = "$(sha256sum "$operator_state" | awk '{print $1}')"
      - name: Upload portable clean-install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-clean-install-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/three-agent-ci-diagnostics
          if-no-files-found: warn
          retention-days: 14

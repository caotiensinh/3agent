name: portable-deploy-ci

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap.sh'
      - 'scripts/test_bootstrap_contract.sh'
      - '.github/workflows/portable-deploy-ci.yml'
      - '.github/workflows/live-chat-multiturn-acceptance.yml'
      - 'src/three_agent/adaptive_learning*.py'
      - 'tests/test_adaptive_learning*.py'
      - 'docs/knowledge/ADAPTIVE_LEARNING*.md'
      - 'src/three_agent/network_*.py'
      - 'tests/test_network_*.py'
      - 'evaluation/network_*.json'
      - 'docs/WORKSPACE_NETWORK_*.md'
      - 'src/three_agent/chat_context.py'
      - 'src/three_agent/chat_gateway_v17.py'
      - 'src/three_agent/chat_output_contract.py'
      - 'src/three_agent/chat_service_fidelity_v2.py'
      - 'src/three_agent/chat_multiturn_acceptance_v2.py'
      - 'tests/test_chat_output_contract.py'
      - 'tests/test_live_multiturn_workflow_contract.py'
      - 'pyproject.toml'
      - 'config/test.example.json'
      - 'README.md'
      - 'docs/PORTABLE_DEPLOY.md'
  pull_request:
    paths:
      - 'scripts/bootstrap.sh'
      - 'scripts/test_bootstrap_contract.sh'
      - '.github/workflows/portable-deploy-ci.yml'
      - '.github/workflows/live-chat-multiturn-acceptance.yml'
      - 'src/three_agent/adaptive_learning*.py'
      - 'tests/test_adaptive_learning*.py'
      - 'docs/knowledge/ADAPTIVE_LEARNING*.md'
      - 'src/three_agent/network_*.py'
      - 'tests/test_network_*.py'
      - 'evaluation/network_*.json'
      - 'docs/WORKSPACE_NETWORK_*.md'
      - 'src/three_agent/chat_context.py'
      - 'src/three_agent/chat_gateway_v17.py'
      - 'src/three_agent/chat_output_contract.py'
      - 'src/three_agent/chat_service_fidelity_v2.py'
      - 'src/three_agent/chat_multiturn_acceptance_v2.py'
      - 'tests/test_chat_output_contract.py'
      - 'tests/test_live_multiturn_workflow_contract.py'
      - 'pyproject.toml'
      - 'config/test.example.json'
      - 'README.md'
      - 'docs/PORTABLE_DEPLOY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
      - name: Bootstrap syntax and contract
        run: bash scripts/test_bootstrap_contract.sh
      - name: ShellCheck
        run: shellcheck scripts/bootstrap.sh scripts/test_bootstrap_contract.sh

  clean-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Resolve deployment ref
        id: deploy_ref
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "${GITHUB_HEAD_REF:-}" ]]; then
            printf 'ref=%s\n' "$GITHUB_HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi
          printf 'expected_head=%s\n' "$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
      - name: One-command bootstrap from GitHub
        shell: bash
        env:
          THREE_AGENT_REPO_URL: https://github.com/${{ github.repository }}.git
          THREE_AGENT_REPO_REF: ${{ steps.deploy_ref.outputs.ref }}
          THREE_AGENT_INSTALL_DIR: ${{ runner.temp }}/three-agent-install
          THREE_AGENT_BIN_DIR: ${{ runner.temp }}/three-agent-bin
          THREE_AGENT_SKIP_SYSTEM_PACKAGES: '1'
        run: bash scripts/bootstrap.sh
      - name: Verify installed command and source lineage
        shell: bash
        run: |
          "${{ runner.temp }}/three-agent-bin/3agent" smoke
          test -x "${{ runner.temp }}/three-agent-bin/3agent-update"
          test -f "${{ runner.temp }}/three-agent-install/config/local.json"
          test "$(git -C "${{ runner.temp }}/three-agent-install" rev-parse HEAD)" = "${{ steps.deploy_ref.outputs.expected_head }}" || {
            echo "Installed commit does not match expected source head" >&2
            exit 1
          }
      - name: Re-run bootstrap idempotently and preserve config
        shell: bash
        env:
          THREE_AGENT_REPO_URL: https://github.com/${{ github.repository }}.git
          THREE_AGENT_REPO_REF: ${{ steps.deploy_ref.outputs.ref }}
          THREE_AGENT_INSTALL_DIR: ${{ runner.temp }}/three-agent-install
          THREE_AGENT_BIN_DIR: ${{ runner.temp }}/three-agent-bin
          THREE_AGENT_SKIP_SYSTEM_PACKAGES: '1'
        run: |
          printf '\n' >> "${{ runner.temp }}/three-agent-install/config/local.json"
          before="$(sha256sum "${{ runner.temp }}/three-agent-install/config/local.json" | awk '{print $1}')"
          bash scripts/bootstrap.sh
          after="$(sha256sum "${{ runner.temp }}/three-agent-install/config/local.json" | awk '{print $1}')"
          test "$before" = "$after"

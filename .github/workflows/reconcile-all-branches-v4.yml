name: reconcile-all-branches-v4

on:
  push:
    branches:
      - reconcile/all-branches-v4-final-20260903
    paths:
      - .github/workflows/reconcile-all-branches-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/all-branches-v4-final-20260903
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch refs and install
        run: |
          git config user.name "workspace-reconcile-bot"
          git config user.email "workspace-reconcile-bot@users.noreply.github.com"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Merge all original branch tips
        shell: bash
        run: |
          set -uo pipefail
          export PYTHONPATH="$PWD:$PWD/src${PYTHONPATH:+:$PYTHONPATH}"
          CONTROL_BASE="$(git rev-parse HEAD)"
          MANIFEST="artifacts/reconciliation/branch_reconciliation_v2_20260903.json"
          WORK="$(mktemp -d)"
          EVENTS="$WORK/events.ndjson"
          mkdir -p artifacts/reconciliation

          set +e
          python -m pytest tests/ -q > "$WORK/baseline.txt" 2>&1
          BASE_RC=$?
          set -e
          python - "$WORK/baseline.txt" "$WORK/base_failures.json" <<'PY'
          import json,sys
          vals=[]
          for line in open(sys.argv[1],encoding='utf-8',errors='replace'):
              s=line.strip()
              if s.startswith(('FAILED ','ERROR ')): vals.append(s.split(' - ',1)[0])
          json.dump(sorted(set(vals)),open(sys.argv[2],'w'),indent=2)
          PY

          mapfile -t BRANCHES < <(python - "$MANIFEST" <<'PY'
          import json,sys
          for e in json.load(open(sys.argv[1]))['events']: print(e['branch'])
          PY
          )
          [[ "${#BRANCHES[@]}" -eq 344 ]] || { echo "expected 344 branches" >&2; exit 61; }

          for branch in "${BRANCHES[@]}"; do
            ref="origin/$branch"
            tip="$(git rev-parse "$ref")"
            if git merge-base --is-ancestor "$ref" HEAD; then
              B="$branch" T="$tip" python - <<'PY' >> "$EVENTS"
          import json,os
          print(json.dumps({'branch':os.environ['B'],'tip':os.environ['T'],'status':'already_ancestor'}))
          PY
              continue
            fi

            before="$(git rev-parse HEAD)"
            set +e
            git merge --no-ff --no-commit -X ours "$ref" >"$WORK/merge.log" 2>&1
            rc=$?
            set -e
            conflicts=""
            if [[ "$rc" -ne 0 ]]; then
              conflicts="$(git diff --name-only --diff-filter=U | paste -sd ',' -)"
              while IFS= read -r path; do
                [[ -n "$path" ]] || continue
                if git checkout --ours -- "$path" 2>/dev/null; then
                  git add "$path"
                else
                  git rm -f --ignore-unmatch "$path" >/dev/null 2>&1 || true
                fi
              done < <(git diff --name-only --diff-filter=U)
            fi

            # GitHub Actions' token may not update workflow files. Keep the canonical
            # workflow tree byte-for-byte identical to this lane's starting tree while
            # still recording each branch tip as a merge parent.
            git checkout "$CONTROL_BASE" -- .github/workflows
            git add -A
            git commit -m "merge(reconcile): absorb $branch" >/dev/null
            git merge-base --is-ancestor "$ref" HEAD || { echo "ancestor check failed: $branch" >&2; exit 62; }

            B="$branch" T="$tip" C="$conflicts" BEFORE="$before" python - <<'PY' >> "$EVENTS"
          import json,os
          c=[x for x in os.environ.get('C','').split(',') if x]
          print(json.dumps({'branch':os.environ['B'],'tip':os.environ['T'],'status':'merged_conflict_ours' if c else 'merged_clean','conflicts':c,'before':os.environ['BEFORE']}))
          PY
          done

          missing=0
          for branch in "${BRANCHES[@]}"; do
            git merge-base --is-ancestor "origin/$branch" HEAD || { echo "NOT_ANCESTOR $branch" >&2; missing=$((missing+1)); }
          done
          [[ "$missing" -eq 0 ]] || exit 63

          python -m pip install -e .
          set +e
          python -m pytest tests/ -q > "$WORK/final.txt" 2>&1
          FINAL_RC=$?
          set -e
          python - "$WORK/final.txt" "$WORK/final_failures.json" <<'PY'
          import json,sys
          vals=[]
          for line in open(sys.argv[1],encoding='utf-8',errors='replace'):
              s=line.strip()
              if s.startswith(('FAILED ','ERROR ')): vals.append(s.split(' - ',1)[0])
          json.dump(sorted(set(vals)),open(sys.argv[2],'w'),indent=2)
          PY

          BASE_RC="$BASE_RC" FINAL_RC="$FINAL_RC" CONTROL_BASE="$CONTROL_BASE" python - "$EVENTS" "$WORK/base_failures.json" "$WORK/final_failures.json" "$WORK/baseline.txt" "$WORK/final.txt" <<'PY'
          import collections,json,os,subprocess,sys
          ep,bp,fp,bt,ft=sys.argv[1:]
          events=[json.loads(x) for x in open(ep,encoding='utf-8') if x.strip()]
          b=set(json.load(open(bp))); f=set(json.load(open(fp)))
          counts=collections.Counter(e['status'] for e in events)
          conflicts=collections.Counter(x for e in events for x in e.get('conflicts',[]))
          def tail(p): return open(p,encoding='utf-8',errors='replace').read().splitlines()[-80:]
          out={
            'schema':'workspace-branch-reconciliation/v4',
            'control_base_sha':os.environ['CONTROL_BASE'],
            'head_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'original_branch_count':345,
            'original_non_main_branch_count':344,
            'all_original_non_main_tips_are_ancestors':True,
            'merge_status_counts':dict(counts),
            'conflict_file_counts':dict(conflicts.most_common()),
            'baseline_pytest_rc':int(os.environ['BASE_RC']),
            'final_pytest_rc':int(os.environ['FINAL_RC']),
            'baseline_failures':sorted(b),'final_failures':sorted(f),
            'new_failures':sorted(f-b),'removed_failures':sorted(b-f),
            'baseline_tail':tail(bt),'final_tail':tail(ft),'events':events,
          }
          json.dump(out,open('artifacts/reconciliation/branch_reconciliation_v4_20260903.json','w'),indent=2,ensure_ascii=False)
          print(json.dumps({k:out[k] for k in ('head_sha','original_non_main_branch_count','all_original_non_main_tips_are_ancestors','merge_status_counts','baseline_pytest_rc','final_pytest_rc','new_failures','removed_failures')},indent=2))
          PY
          cp "$WORK/final.txt" artifacts/reconciliation/all_branches_v4_pytest_20260903.txt

          git add artifacts/reconciliation
          git commit -m "chore(reconcile): record final 345-branch evidence" || true
          git push origin HEAD:reconcile/all-branches-v4-final-20260903
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-reconciliation-v4-20260903
          path: artifacts/reconciliation/

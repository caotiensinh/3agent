name: deploy-ubuntu-2404-rtx5090

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to authorize the test-PC deployment'
        required: true
        default: ''
      model:
        description: 'Ollama model to install'
        required: true
        default: 'qwen3:30b'

permissions:
  contents: read

concurrency:
  group: deploy-rtx5090-test-pc
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: [self-hosted, Linux, X64, rtx5090]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled NVIDIA stack
        run: |
          nvidia-smi
          test "$(nvidia-smi --query-gpu=name --format=csv,noheader | grep -c 'RTX 5090')" -ge 2
      - name: Deploy application and local AI stack
        env:
          THREE_AGENT_MODEL: ${{ inputs.model }}
          THREE_AGENT_REPO_REF: main
          THREE_AGENT_MIN_DRIVER_MAJOR: '590'
          THREE_AGENT_REQUIRED_RTX5090_COUNT: '2'
          OLLAMA_CONTEXT_LENGTH: '65536'
        run: bash scripts/setup_ai_stack_ubuntu2404.sh
      - name: Final status
        run: |
          3agent smoke
          ollama ps
          nvidia-smi

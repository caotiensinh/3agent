name: installer-ci

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
      - 'profiles/**'
      - 'docs/**'
      - 'skills/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
      - 'profiles/**'
      - 'docs/**'
      - 'skills/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Installer diagnostic snapshot
        shell: bash
        run: |
          source scripts/ci_diagnostics.sh
          ci_diag_snapshot "installer-shell-contract"
      - name: Bash syntax and installer contracts
        shell: bash
        run: |
          source scripts/ci_diagnostics.sh
          failures=0
          for script in \
            scripts/test_installer_contract.sh \
            scripts/test_ai_stack_contract.sh \
            scripts/test_model_pool_contract.sh \
            scripts/test_gpu_worker_pool_contract.sh \
            scripts/test_ram_baseline_contract.sh \
            scripts/test_runner_pool_contract.sh \
            scripts/test_e2e_acceptance_contract.sh \
            scripts/test_chat_gateway_contract.sh \
            scripts/test_lan_ai_server_contract.sh \
            scripts/test_workspace_security_contract.sh \
            scripts/test_workspace_knowledge_contract.sh \
            scripts/test_identity_broker_contract.sh
          do
            label="contract-$(basename "$script" .sh)"
            if ! ci_run_logged "$label" bash "$script"; then
              failures=$((failures + 1))
            fi
          done
          if [[ "$failures" -ne 0 ]]; then
            ci_failure_snapshot "installer-contracts-${failures}-failed"
            exit 1
          fi
      - name: ShellCheck
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          source scripts/ci_diagnostics.sh
          ci_run_logged "installer-shellcheck" shellcheck \
            scripts/install_ubuntu_2404_rtx5090.sh \
            scripts/setup_ai_stack_ubuntu2404.sh \
            scripts/enable_model_pool.sh \
            scripts/enable_gpu_worker_pool.sh \
            scripts/test_gpu_worker_pool_contract.sh \
            scripts/measure_ram_baseline.sh \
            scripts/test_ram_baseline_contract.sh \
            scripts/setup_runner_pool.sh \
            scripts/test_runner_pool_contract.sh \
            scripts/setup_lan_ai_server.sh \
            scripts/verify_deployment.sh \
            scripts/run_e2e_acceptance.sh \
            scripts/install_chat_gateway.sh \
            scripts/configure_telegram.sh \
            scripts/install_workspace_secure_boundary.sh \
            scripts/install_workspace_knowledge_plane.sh \
            scripts/install_workspace_identity_broker.sh \
            scripts/setup_workspace_secure.sh \
            scripts/test_installer_contract.sh \
            scripts/test_ai_stack_contract.sh \
            scripts/test_model_pool_contract.sh \
            scripts/test_e2e_acceptance_contract.sh \
            scripts/test_chat_gateway_contract.sh \
            scripts/test_lan_ai_server_contract.sh \
            scripts/test_workspace_security_contract.sh \
            scripts/test_workspace_knowledge_contract.sh \
            scripts/test_identity_broker_contract.sh \
            scripts/ci_diagnostics.sh
      - name: Upload installer shell diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-shell-diagnostics
          path: ${{ runner.temp }}/three-agent-ci-diagnostics
          if-no-files-found: warn
          retention-days: 14

  harness-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Harness diagnostic snapshot
        shell: bash
        run: |
          source scripts/ci_diagnostics.sh
          ci_diag_snapshot "installer-harness-regression"
      - name: Existing harness tests
        shell: bash
        run: |
          source scripts/ci_diagnostics.sh
          ci_run_logged "installer-existing-harness-tests" bash scripts/test.sh
      - name: Harness smoke
        if: always()
        shell: bash
        run: |
          source scripts/ci_diagnostics.sh
          ci_run_logged "installer-harness-smoke" bash scripts/smoke.sh
      - name: Upload installer harness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-harness-diagnostics
          path: ${{ runner.temp }}/three-agent-ci-diagnostics
          if-no-files-found: warn
          retention-days: 14

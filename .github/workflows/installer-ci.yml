name: installer-ci

on:
  push:
    branches: [main]
    paths:
      - 'scripts/install_ubuntu_2404_rtx5090.sh'
      - 'scripts/verify_deployment.sh'
      - 'scripts/test_installer_contract.sh'
      - '.github/workflows/installer-ci.yml'
      - '.github/workflows/deploy-rtx5090.yml'
      - 'docs/DEPLOY_UBUNTU_2404_RTX5090.md'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'docs/DEPLOY_UBUNTU_2404_RTX5090.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and installer contract
        run: bash scripts/test_installer_contract.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck scripts/install_ubuntu_2404_rtx5090.sh scripts/verify_deployment.sh scripts/test_installer_contract.sh

  harness-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing harness tests
        run: bash scripts/test.sh
      - name: Harness smoke
        run: bash scripts/smoke.sh

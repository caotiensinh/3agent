name: installer-ci

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
      - 'profiles/**'
      - 'docs/**'
      - 'skills/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
      - 'profiles/**'
      - 'docs/**'
      - 'skills/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and installer contracts
        run: |
          bash scripts/test_installer_contract.sh
          bash scripts/test_ai_stack_contract.sh
          bash scripts/test_model_pool_contract.sh
          bash scripts/test_e2e_acceptance_contract.sh
          bash scripts/test_chat_gateway_contract.sh
          bash scripts/test_lan_ai_server_contract.sh
          bash scripts/test_workspace_security_contract.sh
          bash scripts/test_workspace_knowledge_contract.sh
          bash scripts/test_identity_broker_contract.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck \
            scripts/install_ubuntu_2404_rtx5090.sh \
            scripts/setup_ai_stack_ubuntu2404.sh \
            scripts/enable_model_pool.sh \
            scripts/setup_lan_ai_server.sh \
            scripts/verify_deployment.sh \
            scripts/run_e2e_acceptance.sh \
            scripts/install_chat_gateway.sh \
            scripts/configure_telegram.sh \
            scripts/install_workspace_secure_boundary.sh \
            scripts/install_workspace_knowledge_plane.sh \
            scripts/install_workspace_identity_broker.sh \
            scripts/setup_workspace_secure.sh \
            scripts/test_installer_contract.sh \
            scripts/test_ai_stack_contract.sh \
            scripts/test_model_pool_contract.sh \
            scripts/test_e2e_acceptance_contract.sh \
            scripts/test_chat_gateway_contract.sh \
            scripts/test_lan_ai_server_contract.sh \
            scripts/test_workspace_security_contract.sh \
            scripts/test_workspace_knowledge_contract.sh \
            scripts/test_identity_broker_contract.sh

  harness-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Capture harness environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "PYTHON=$(python --version 2>&1)"
            echo "PIP_FREEZE_BEGIN"
            python -m pip freeze
            echo "PIP_FREEZE_END"
            python - <<'PY'
          import importlib.util
          for name in ("pysnmp", "PIL", "docx", "pptx", "reportlab"):
              spec = importlib.util.find_spec(name)
              print(f"IMPORT_SPEC {name}={spec.origin if spec else 'MISSING'}")
          PY
          } 2>&1 | tee "$RUNNER_TEMP/harness-environment.log"
      - name: Existing harness tests
        shell: bash
        run: |
          set +e
          bash scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/harness-regression.log"
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"
      - name: Upload harness regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-harness-regression
          path: |
            ${{ runner.temp }}/harness-environment.log
            ${{ runner.temp }}/harness-regression.log
          if-no-files-found: error
          retention-days: 7
      - name: Harness smoke
        run: bash scripts/smoke.sh

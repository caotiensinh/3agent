name: computer-use-windows-observation-ci

on:
  pull_request:
    paths:
      - 'src/three_agent/computer_use_windows_observation.py'
      - 'tests/test_computer_use_windows_observation.py'
      - 'tests/test_computer_use_windows_observation_live.py'
      - '.github/workflows/computer-use-windows-observation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cu160-windows-observation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-observation-acceptance:
    name: acceptance (python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install exact candidate
        shell: pwsh
        run: python -m pip install -e .
      - name: Verify exact checked-out head
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (& git rev-parse HEAD | Select-Object -First 1).Trim()
          if ($actual -ne $env:EXPECTED_HEAD) {
            throw "Checked out SHA $actual does not match expected $env:EXPECTED_HEAD"
          }
      - name: Run CU-160 bounded and privacy boundary tests
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_computer_use_windows_observation.py' -v
      - name: Run CU-160 live Windows UI Automation acceptance
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_computer_use_windows_observation_live.py' -v
      - name: Record CU-160 acceptance summary
        if: always()
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          @(
            'CU-160 Windows observation acceptance',
            "head=$env:EXPECTED_HEAD",
            "python=${{ matrix.python }}",
            'runner=windows-latest',
            'scope=bounded metadata + UI Automation + privacy boundaries + live read-only backend',
            'privileged_broker=not_used'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

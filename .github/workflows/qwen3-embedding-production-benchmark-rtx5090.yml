name: qwen3-embedding-production-benchmark-dual-gpu

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config/model-candidates/qwen3-embedding-0.6b.production-benchmark-request.json'
      - '.github/workflows/qwen3-embedding-production-benchmark-rtx5090.yml'
      - 'scripts/run_qwen3_production_benchmark.sh'
      - 'scripts/run_qwen3_production_benchmark.py'
      - 'scripts/run_with_network_seccomp.py'

permissions:
  contents: read

concurrency:
  group: gpu-embedding-production-exclusive
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  production-benchmark:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted]
    timeout-minutes: 120
    steps:
      - name: Checkout exact trusted main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify trusted source and representative hardware
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -s)" = Linux
          case "$(uname -m)" in x86_64|amd64) ;; *) echo "ERROR: unsupported architecture $(uname -m)" >&2; exit 3 ;; esac
          command -v nvidia-smi >/dev/null || { echo 'ERROR: nvidia-smi missing' >&2; exit 20; }
          echo '=== GPU inventory ==='
          nvidia-smi --query-gpu=index,name,memory.total,driver_version --format=csv,noheader
          GPU_COUNT="$(nvidia-smi --query-gpu=index --format=csv,noheader | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          test "$GPU_COUNT" -ge 2 || { echo "ERROR: representative dual-GPU gate requires >=2 NVIDIA GPUs; found $GPU_COUNT" >&2; exit 21; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path('config/model-candidates/qwen3-embedding-0.6b.production-benchmark-request.json').read_text(encoding='utf-8'))
          source = json.loads(Path('config/model-candidates/qwen3-embedding-0.6b.source.json').read_text(encoding='utf-8'))
          assert request.get('schema') == 'workspace.model-candidate-production-benchmark-request/v1'
          assert request.get('status') == 'requested'
          assert request.get('gate') == 'representative_dual_gpu_retrieval_benchmark'
          assert request.get('candidate_id') == 'qwen3-embedding-0.6b'
          assert request.get('repo_id') == source.get('repo_id')
          assert request.get('revision') == source.get('revision')
          assert request.get('minimum_cuda_devices') == 2
          assert request.get('hardware_identity_policy') == 'record_actual_devices_and_require_two_cuda_devices'
          assert request.get('required_runner_labels') == ['self-hosted']
          assert request.get('production_approval') is False
          assert request.get('runtime_authority') is False
          assert source.get('approval', {}).get('approved') is False
          print('trusted production benchmark request validated')
          PY

      - name: Prove recoverable OS-level network isolation before model download
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/run_qwen3_production_benchmark.sh --probe-isolation

      - name: Create isolated benchmark environment
        shell: bash
        run: |
          set -Eeuo pipefail
          VENV_ROOT="$RUNNER_TEMP/workspace-qwen3-benchmark-venv-$GITHUB_RUN_ID"
          python3 -m venv --system-site-packages "$VENV_ROOT"
          echo "$VENV_ROOT/bin" >> "$GITHUB_PATH"
          echo "QWEN_BENCH_VENV=$VENV_ROOT" >> "$GITHUB_ENV"

      - name: Install audited model and embedding dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -e '.[model-provisioning,embedding-runtime]'
          python - <<'PY'
          import torch
          from sentence_transformers import SentenceTransformer
          print('torch_cuda_available=', torch.cuda.is_available())
          print('torch_cuda_device_count=', torch.cuda.device_count())
          print('torch_devices=', [torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())])
          assert torch.cuda.is_available(), 'CUDA unavailable'
          assert torch.cuda.device_count() >= 2, torch.cuda.device_count()
          PY

      - name: Run audited offline dual-GPU production benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/run_qwen3_production_benchmark.sh \
            "$RUNNER_TEMP/qwen3-production-benchmark.json"

      - name: Validate evidence remains non-authoritative
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['RUNNER_TEMP']) / 'qwen3-production-benchmark.json').read_text(encoding='utf-8'))
          assert receipt.get('schema') == 'workspace.embedding-production-benchmark/v1'
          assert receipt.get('status') == 'production_benchmark_pass'
          assert receipt.get('checks', {}).get('dual_gpu_inference') is True
          assert receipt.get('checks', {}).get('integrity_revalidated_per_gpu') is True
          assert receipt.get('checks', {}).get('gpu_memory_released') is True
          assert receipt.get('admission', {}).get('production_approval') is False
          assert receipt.get('admission', {}).get('runtime_authority') is False
          assert receipt.get('security', {}).get('runtime_download') is False
          assert receipt.get('security', {}).get('local_files_only') is True
          assert receipt.get('security', {}).get('trust_remote_code') is False
          assert receipt.get('security', {}).get('network_isolation_mode') in {
              'sudo-net', 'userns-net', 'firejail-net', 'seccomp-no-network', 'docker-none'
          }
          print(json.dumps({
              'status': receipt['status'],
              'checks': receipt['checks'],
              'hardware': receipt['hardware'],
              'security': receipt['security'],
          }, sort_keys=True))
          PY

      - name: Delete model bytes, caches and benchmark environment
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/workspace-qwen3-production-$GITHUB_RUN_ID" \
            "${QWEN_BENCH_VENV:-}"
          rm -f "$RUNNER_TEMP/qwen3-empty-$GITHUB_RUN_ID.tar"

      - name: Upload benchmark receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-embedding-production-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/qwen3-production-benchmark.json
          if-no-files-found: warn
          retention-days: 14

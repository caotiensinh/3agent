name: Aiserver Runner Inventory

on:
  push:
    branches:
      - ops/aiserver-runner-inventory-v1

permissions:
  contents: read

jobs:
  inventory:
    name: read-only-runner-inventory
    runs-on: [self-hosted, Linux, X64, r9]
    timeout-minutes: 10
    steps:
      - name: Inventory runner host read-only
        shell: bash
        run: |
          set -u -o pipefail

          echo '=== EXECUTION IDENTITY ==='
          echo "runner=${{ runner.name }}"
          echo "runner_temp=${{ runner.temp }}"
          echo "workspace=${GITHUB_WORKSPACE}"
          echo "machine=$(hostname)"
          echo "user=$(whoami)"
          id
          uname -a

          echo '=== PATH ACCESS BOUNDARY ==='
          for path in \
            /opt/actions-runner \
            /home/aiserver \
            /home/aiserver/actions-runner \
            /home/aiserver/3agent/actions-runner; do
            echo "--- namei ${path} ---"
            namei -l "${path}" 2>&1 || true
          done

          echo '=== KNOWN RUNNER ROOTS ==='
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          roots = [
              Path('/opt/actions-runner'),
              Path('/home/aiserver/actions-runner'),
              Path('/home/aiserver/3agent/actions-runner'),
          ]
          safe_identity_fields = ('agentName', 'gitHubUrl', 'workFolder')
          safe_files = ('.runner', 'svc.sh', 'config.sh', 'run.sh', 'bin/Runner.Listener')

          def classify_path(path: Path) -> None:
              try:
                  st = path.stat()
                  print(
                      f'ROOT path={path} exists=true uid={st.st_uid} gid={st.st_gid} '
                      f'mode={oct(st.st_mode & 0o777)} readable={os.access(path, os.R_OK)} '
                      f'executable={os.access(path, os.X_OK)}'
                  )
              except FileNotFoundError:
                  print(f'ROOT path={path} exists=false')
              except PermissionError:
                  print(f'ROOT path={path} status=PERMISSION_DENIED')
              except Exception as exc:
                  print(f'ROOT path={path} status=UNREADABLE error={type(exc).__name__}')

          for root in roots:
              classify_path(root)

              for rel in safe_files:
                  p = root / rel
                  try:
                      st = p.stat()
                      print(
                          f'FILE path={p} exists=true uid={st.st_uid} gid={st.st_gid} '
                          f'mode={oct(st.st_mode & 0o777)}'
                      )
                  except FileNotFoundError:
                      print(f'FILE path={p} exists=false')
                  except PermissionError:
                      print(f'FILE path={p} status=PERMISSION_DENIED')
                  except Exception as exc:
                      print(f'FILE_STAT_ERROR path={p} error={type(exc).__name__}')

              registration = root / '.runner'
              try:
                  raw = registration.read_text(encoding='utf-8-sig')
                  data = json.loads(raw)
                  identity = {key: data.get(key) for key in safe_identity_fields}
                  print(f'IDENTITY path={root} data={json.dumps(identity, sort_keys=True)}')
              except FileNotFoundError:
                  print(f'IDENTITY path={root} status=MISSING')
              except PermissionError:
                  print(f'IDENTITY path={root} status=PERMISSION_DENIED')
              except json.JSONDecodeError:
                  print(f'IDENTITY path={root} status=NON_JSON')
              except Exception as exc:
                  print(f'IDENTITY path={root} status=UNREADABLE error={type(exc).__name__}')
          PY

          echo '=== SYSTEMD RUNNER UNIT FILES ==='
          systemctl list-unit-files --type=service --no-pager 2>&1 |
            grep -E '^actions\.runner\.' || true

          echo '=== SYSTEMD RUNNER UNITS ==='
          systemctl list-units --type=service --all --no-pager 2>&1 |
            grep -E 'actions\.runner\.' || true

          mapfile -t units < <(
            systemctl list-unit-files --type=service --no-legend --no-pager 2>/dev/null |
              awk '/^actions\.runner\./ {print $1}'
          )

          for unit in "${units[@]}"; do
            echo "=== UNIT ${unit} ==="
            systemctl show "${unit}" \
              -p Id \
              -p LoadState \
              -p ActiveState \
              -p SubState \
              -p UnitFileState \
              -p FragmentPath \
              -p User \
              -p Group \
              -p WorkingDirectory \
              -p MainPID \
              -p ExecMainStatus \
              -p ExecStart \
              --no-pager 2>&1 || true
          done

          echo '=== RUNNER PROCESS SUMMARY ==='
          ps -eo pid=,ppid=,user=,comm= 2>/dev/null |
            awk '$4 ~ /Runner\.(Listener|Worker)/ {print}' || true

          echo '=== RUNNER LISTENER PATHS ==='
          python3 - <<'PY'
          import os
          from pathlib import Path

          for proc in sorted(Path('/proc').glob('[0-9]*'), key=lambda p: int(p.name)):
              try:
                  comm = (proc / 'comm').read_text(encoding='utf-8').strip()
              except Exception:
                  continue
              if comm != 'Runner.Listener':
                  continue
              try:
                  exe = os.path.realpath(proc / 'exe')
              except Exception:
                  exe = 'UNREADABLE'
              try:
                  cwd = os.path.realpath(proc / 'cwd')
              except Exception:
                  cwd = 'UNREADABLE'
              print(f'LISTENER pid={proc.name} exe={exe} cwd={cwd}')
          PY

          echo '=== NONINTERACTIVE SUDO POLICY (READ-ONLY QUERY) ==='
          if command -v sudo >/dev/null 2>&1; then
            sudo -n -l 2>&1 || true
          else
            echo 'sudo=NOT_INSTALLED'
          fi

          echo 'CLASSIFICATION=READ_ONLY_AISERVER_RUNNER_INVENTORY_COMPLETE'

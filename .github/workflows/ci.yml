name: harness-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project dependencies including monitoring SNMP extra
        run: python -m pip install -e ".[monitoring-snmp]"
      - name: Execution governance canonical gate
        run: python scripts/validate_execution_governance.py
      - name: Skill security admission
        run: python scripts/scan_skills.py
      - name: Compile
        run: python -m compileall -q src tests scripts/validate_execution_governance.py
      - name: Governance unit-test provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "PWD=$(pwd)"
            echo "STATUS_BEGIN"
            git status --short
            echo "STATUS_END"
            echo "TRACKED_GOVERNANCE_FILES_BEGIN"
            git ls-files | grep -E '(^|/)(test_execution_governance|validate_execution_governance)' || true
            echo "TRACKED_GOVERNANCE_FILES_END"
            echo "FOUND_GOVERNANCE_FILES_BEGIN"
            find scripts tests -maxdepth 2 -type f -name '*execution*governance*' -print -exec sha256sum {} \;
            echo "FOUND_GOVERNANCE_FILES_END"
            echo "GOVERNANCE_SYMBOL_SOURCES_BEGIN"
            grep -RInE '\[governance-check\]|ExecutionGovernanceGuardTests|test_repo_state_passes|new parallel/version-style paths detected' scripts tests || true
            echo "GOVERNANCE_SYMBOL_SOURCES_END"
            if [[ -f scripts/test_execution_governance.py ]]; then
              echo "RUNTIME_GOVERNANCE_SCRIPT_BEGIN"
              echo "realpath=$(realpath scripts/test_execution_governance.py)"
              if git ls-files --error-unmatch scripts/test_execution_governance.py >/dev/null 2>&1; then
                echo "tracked=yes"
              else
                echo "tracked=no"
              fi
              sha256sum scripts/test_execution_governance.py
              sed -n '1,360p' scripts/test_execution_governance.py
              echo "RUNTIME_GOVERNANCE_SCRIPT_END"
            fi
            python - <<'PY'
          import sys
          print("PYTHON_EXECUTABLE=", sys.executable)
          print("PYTHON_SYS_PATH=", sys.path)
          PY
          } 2>&1 | tee "$RUNNER_TEMP/governance-provenance.log"
      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"
      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/governance-provenance.log
            ${{ runner.temp }}/unittest.log
          if-no-files-found: error
          retention-days: 7
      - name: Enterprise verification EV-01 through EV-10
        env:
          EXACT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/security_enterprise_verify.py \
            --source-sha "$EXACT_SOURCE_SHA" \
            --output "$RUNNER_TEMP/security-enterprise-verification.json"
      - name: Upload enterprise verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: security-enterprise-verification-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/security-enterprise-verification.json
          if-no-files-found: error
          retention-days: 14

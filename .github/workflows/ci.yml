name: harness-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project dependencies including monitoring SNMP extra
        run: python -m pip install -e ".[monitoring-snmp]"
      - name: Execution governance canonical gate
        run: python scripts/validate_execution_governance.py
      - name: Skill security admission
        run: python scripts/scan_skills.py
      - name: Compile
        run: python -m compileall -q src tests scripts/validate_execution_governance.py
      - name: Guardian flow binding regression
        run: python -m unittest -v tests.test_security_operation_binding
      - name: Guardian flow analysis regression
        run: python -m unittest -v tests.test_security_flow_analysis_v09
      - name: Guardian operation invocation regression
        run: python -m unittest -v tests.test_security_operation_invocation
      - name: Regression bisect A-D
        if: always()
        run: python -m unittest discover -s tests -p 'test_[a-d]*.py' -v
      - name: Regression bisect E-H
        if: always()
        run: python -m unittest discover -s tests -p 'test_[e-h]*.py' -v
      - name: Regression bisect I-M
        if: always()
        run: python -m unittest discover -s tests -p 'test_[i-m]*.py' -v
      - name: Regression bisect N-R
        if: always()
        run: python -m unittest discover -s tests -p 'test_[n-r]*.py' -v
      - name: Diagnostic local console direct
        if: always()
        run: python -m unittest -v tests.test_security_local_console
      - name: Diagnostic security first quartile
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          import unittest

          files = sorted(pathlib.Path("tests").glob("test_security_*.py"))
          stop = max(1, (len(files) + 3) // 4)
          modules = [f"tests.{path.stem}" for path in files[:stop]]
          print(f"security-files={len(files)} selected=0:{stop}")
          print("\n".join(modules))
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromNames(modules)
          )
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Diagnostic security first half
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          import unittest

          files = sorted(pathlib.Path("tests").glob("test_security_*.py"))
          stop = max(1, (len(files) + 1) // 2)
          modules = [f"tests.{path.stem}" for path in files[:stop]]
          print(f"security-files={len(files)} selected=0:{stop}")
          print("\n".join(modules))
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromNames(modules)
          )
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Diagnostic security first three quartiles
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          import unittest

          files = sorted(pathlib.Path("tests").glob("test_security_*.py"))
          stop = max(1, (3 * len(files) + 3) // 4)
          modules = [f"tests.{path.stem}" for path in files[:stop]]
          print(f"security-files={len(files)} selected=0:{stop}")
          print("\n".join(modules))
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromNames(modules)
          )
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Diagnostic security all
        if: always()
        run: python -m unittest discover -s tests -p 'test_security_*.py' -v
      - name: Diagnostic T-Z
        if: always()
        run: python -m unittest discover -s tests -p 'test_[t-z]*.py' -v
      - name: Unit tests
        if: always()
        run: python -m unittest discover -s tests -v
      - name: Enterprise verification EV-01 through EV-10
        env:
          EXACT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/security_enterprise_verify.py \
            --source-sha "$EXACT_SOURCE_SHA" \
            --output "$RUNNER_TEMP/security-enterprise-verification.json"
      - name: Upload enterprise verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: security-enterprise-verification-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/security-enterprise-verification.json
          if-no-files-found: error
          retention-days: 14
name: harness-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project dependencies including monitoring SNMP extra
        run: python -m pip install -e ".[monitoring-snmp]"
      - name: Execution governance canonical gate
        run: python scripts/validate_execution_governance.py
      - name: Skill security admission
        run: python scripts/scan_skills.py
      - name: Compile
        run: python -m compileall -q src tests scripts/validate_execution_governance.py
      - name: Guardian flow binding regression
        run: python -m unittest -v tests.test_security_operation_binding
      - name: Guardian flow analysis regression
        run: python -m unittest -v tests.test_security_flow_analysis_v09
      - name: Guardian operation invocation regression
        run: python -m unittest -v tests.test_security_operation_invocation
      - name: Regression bisect A-D
        if: always()
        run: python -m unittest discover -s tests -p 'test_[a-d]*.py' -v
      - name: Regression bisect E-H
        if: always()
        run: python -m unittest discover -s tests -p 'test_[e-h]*.py' -v
      - name: Regression bisect I-M
        if: always()
        run: python -m unittest discover -s tests -p 'test_[i-m]*.py' -v
      - name: Regression bisect N-R
        if: always()
        run: python -m unittest discover -s tests -p 'test_[n-r]*.py' -v
      - name: Diagnostic local console direct
        if: always()
        run: python -m unittest -v tests.test_security_local_console
      - name: Diagnostic security 8 of 16
        if: always()
        run: |
          SECURITY_NUM=8 SECURITY_DEN=16 python - <<'PY'
          import os
          import pathlib
          import unittest

          files = sorted(pathlib.Path("tests").glob("test_security_*.py"))
          num = int(os.environ["SECURITY_NUM"])
          den = int(os.environ["SECURITY_DEN"])
          stop = max(1, (num * len(files) + den - 1) // den)
          modules = [f"tests.{path.stem}" for path in files[:stop]]
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromNames(modules)
          )
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Diagnostic security 9 of 16
        if: always()
        run: |
          SECURITY_NUM=9 SECURITY_DEN=16 python - <<'PY'
          import os
          import pathlib
          import unittest

          files = sorted(pathlib.Path("tests").glob("test_security_*.py"))
          num = int(os.environ["SECURITY_NUM"])
          den = int(os.environ["SECURITY_DEN"])
          stop = max(1, (num * len(files) + den - 1) // den)
          modules = [f"tests.{path.stem}" for path in files[:stop]]
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromNames(modules)
          )
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Diagnostic security 10 of 16
        if: always()
        run: |
          SECURITY_NUM=10 SECURITY_DEN=16 python - <<'PY'
          import os
          import pathlib
          import unittest

          files = sorted(pathlib.Path("tests").glob("test_security_*.py"))
          num = int(os.environ["SECURITY_NUM"])
          den = int(os.environ["SECURITY_DEN"])
          stop = max(1, (num * len(files) + den - 1) // den)
          modules = [f"tests.{path.stem}" for path in files[:stop]]
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromNames(modules)
          )
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Diagnostic security 11 of 16
        if: always()
        run: |
          SECURITY_NUM=11 SECURITY_DEN=16 python - <<'PY'
          import os
          import pathlib
          import unittest

          files = sorted(pathlib.Path("tests").glob("test_security_*.py"))
          num = int(os.environ["SECURITY_NUM"])
          den = int(os.environ["SECURITY_DEN"])
          stop = max(1, (num * len(files) + den - 1) // den)
          modules = [f"tests.{path.stem}" for path in files[:stop]]
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromNames(modules)
          )
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Diagnostic security 12 of 16
        if: always()
        run: |
          SECURITY_NUM=12 SECURITY_DEN=16 python - <<'PY'
          import os
          import pathlib
          import unittest

          files = sorted(pathlib.Path("tests").glob("test_security_*.py"))
          num = int(os.environ["SECURITY_NUM"])
          den = int(os.environ["SECURITY_DEN"])
          stop = max(1, (num * len(files) + den - 1) // den)
          modules = [f"tests.{path.stem}" for path in files[:stop]]
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromNames(modules)
          )
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Diagnostic security all
        if: always()
        run: python -m unittest discover -s tests -p 'test_security_*.py' -v
      - name: Diagnostic T-Z
        if: always()
        run: python -m unittest discover -s tests -p 'test_[t-z]*.py' -v
      - name: Unit tests
        if: always()
        run: python -m unittest discover -s tests -v
      - name: Enterprise verification EV-01 through EV-10
        env:
          EXACT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/security_enterprise_verify.py \
            --source-sha "$EXACT_SOURCE_SHA" \
            --output "$RUNNER_TEMP/security-enterprise-verification.json"
      - name: Upload enterprise verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: security-enterprise-verification-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/security-enterprise-verification.json
          if-no-files-found: error
          retention-days: 14

  security-boundary-prepare:
    name: Security boundary candidate manifest
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.candidates.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: candidates
        name: Compute 10/16 to 11/16 candidate modules
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          files = sorted(pathlib.Path("tests").glob("test_security_*.py"))
          count = len(files)
          lo = (10 * count + 15) // 16
          hi = (11 * count + 15) // 16
          candidates = [f"tests.{path.stem}" for path in files[lo:hi]]
          if not candidates:
              raise SystemExit("no boundary candidates")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("modules=" + json.dumps(candidates, separators=(",", ":")) + "\n")
          PY

  security-boundary:
    name: Boundary ${{ matrix.module }}
    needs: security-boundary-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.security-boundary-prepare.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies including monitoring SNMP extra
        run: python -m pip install -e ".[monitoring-snmp]"
      - name: Run cumulative suite through candidate
        env:
          CANDIDATE_MODULE: ${{ matrix.module }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import unittest

          modules = [f"tests.{path.stem}" for path in sorted(pathlib.Path("tests").glob("test_security_*.py"))]
          candidate = os.environ["CANDIDATE_MODULE"]
          stop = modules.index(candidate) + 1
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromNames(modules[:stop])
          )
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
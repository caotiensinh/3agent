name: lanl-publisher-access-contract

on:
  pull_request:
    paths:
      - '.github/workflows/lanl-publisher-access-contract.yml'
      - 'tests/test_network_lanl_publisher_access.py'
      - 'tests/test_network_lanl_publisher_access_workflow_scope.py'
      - 'evaluation/network_v3_02e_lanl_publisher_access_v1.json'
      - 'pyproject.toml'
      - 'src/three_agent/__init__.py'
      - 'src/three_agent/network_lanl_publisher_access.py'
      - 'src/three_agent/network_lanl_adapter.py'
      - 'src/three_agent/network_lanl_dns_adapter.py'
      - 'src/three_agent/network_lanl_flow_adapter.py'
      - 'src/three_agent/network_lanl_process_adapter.py'
      - 'src/three_agent/network_lanl_redteam_matcher.py'
      - 'src/three_agent/network_lanl_family.py'
      - 'src/three_agent/network_corpus_adapter.py'
      - 'src/three_agent/network_real_source_acceptance_contract.py'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanl-publisher-access-contract-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  access-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: python -m pip install -e .

      - name: Run LANL publisher-access adversarial harness
        run: python -m unittest tests.test_network_lanl_publisher_access -v

      - name: Verify current no-access state fails closed as insufficient evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/lanl-access-readiness.json"
          set +e
          python -m three_agent.network_lanl_publisher_access \
            --profile "$GITHUB_WORKSPACE/evaluation/network_v3_02e_lanl_publisher_access_v1.json" \
            --output "$output"
          rc=$?
          set -e
          test "$rc" -eq 2
          python - "$output" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          receipt = json.loads(path.read_text(encoding="utf-8"))
          if receipt.get("readiness") != "NOT_ENOUGH_REAL_SOURCE_EVIDENCE":
              raise SystemExit("LANL no-access state must remain insufficient evidence")
          if receipt.get("failed_gate_ids") != ["LANL_ACCESS_HANDLE_MISSING"]:
              raise SystemExit("LANL missing-access gate drifted")
          if receipt.get("validated_source_families") != []:
              raise SystemExit("no-access state may not validate source families")
          if len(receipt.get("missing_source_families", [])) != 5:
              raise SystemExit("all five LANL source families must remain missing")
          PY
          cp "$output" "$GITHUB_WORKSPACE/lanl-access-readiness.json"

      - name: Upload compact LANL access readiness receipt
        uses: actions/upload-artifact@v4
        with:
          name: lanl-publisher-access-readiness-${{ env.EXACT_HEAD }}
          if-no-files-found: error
          retention-days: 14
          path: lanl-access-readiness.json

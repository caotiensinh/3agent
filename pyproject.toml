[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-local-ai"
version = "1!0.0.2"
description = "WorkSpace: local-first AI runtime for confidential internal business work"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10,<13",
  "python-docx>=1.1.2,<2",
  "python-pptx>=1.0.2,<2",
  "reportlab>=4.2,<5",
  "tzdata>=2024.1",
]

[project.scripts]
workspace = "three_agent.cli:main"
workspace-benchmark = "three_agent.benchmark_suite:main"
workspace-benchmark-canonicalize = "three_agent.benchmark_artifact_canonicalize:main"
workspace-benchmark-readiness = "three_agent.benchmark_readiness:main"
workspace-benchmark-verify = "three_agent.benchmark_evidence:main"
workspace-capability = "three_agent.capability_revocation:main"
workspace-chat = "three_agent.chat_gateway_v17:main"
workspace-chat-acceptance = "three_agent.chat_acceptance:main"
workspace-chat-multiturn-acceptance = "three_agent.chat_multiturn_acceptance_v2:main"
workspace-egressd = "three_agent.egress_broker:main"
workspace-eval = "three_agent.evaluation_lab:main"
workspace-eval-efficiency-handoff = "three_agent.efficiency_evaluator_handoff:main"
workspace-eval-efficiency-observe = "three_agent.efficiency_concurrency_observer:main"
workspace-eval-handoff = "three_agent.external_evaluator_handoff:main"
workspace-eval-profile = "three_agent.evaluation_profiles:main"
workspace-identity-broker = "three_agent.workspace_identity_broker:main"
workspace-knowledge = "three_agent.knowledge_cli:main"
workspace-network-data = "three_agent.network_dataset_cli:main"
workspace-promotion = "three_agent.promotion_gate:main"
workspace-retrieval = "three_agent.deterministic_retrieval_cli:main"
three-agent = "three_agent.cli:main"
three-agent-chat = "three_agent.chat_gateway_v17:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-local-ai"
version = "0.7.0"
description = "WorkSpace: local-first AI runtime for confidential internal business work"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10,<13",
  "python-docx>=1.1.2,<2",
  "python-pptx>=1.0.2,<2",
  "reportlab>=4.2,<5",
  "tzdata>=2024.1",
]

[project.scripts]
workspace = "three_agent.cli:main"
workspace-chat = "three_agent.chat_gateway_v4:main"
workspace-egressd = "three_agent.egress_broker:main"
workspace-knowledge = "three_agent.knowledge_cli:main"
three-agent = "three_agent.cli:main"
three-agent-chat = "three_agent.chat_gateway_v4:main"

[tool.setuptools.packages.find]
where = ["src"]

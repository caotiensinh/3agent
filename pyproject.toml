[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "three-agent"
version = "0.1.0"
description = "Local-first three-agent R&D workflow harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
three-agent = "three_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
